<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist – HarmaalWale</title>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https: data:;">
    <link rel="canonical" href="https://harmaalwale.com/wishlist.html">
    <meta name="description" content="Your HarmaalWale wishlist. Save products you love and add them to cart anytime.">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/hw.css">
  <style>
    .wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}
    .wish-card{background:var(--bg-2);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;transition:all .2s;}
    .wish-card:hover{border-color:var(--accent);transform:translateY(-2px);}
    .wish-img{height:180px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;}
    .wish-img img{max-width:100%;max-height:100%;object-fit:contain;padding:8px;}
    .wish-remove{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;border:none;transition:background .2s;}
    .wish-remove:hover{background:var(--error);}
    .wish-body{padding:14px;}
    .wish-cat{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
    .wish-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:10px;line-height:1.2;}
    .wish-actions{display:flex;gap:8px;}
    .empty-state{text-align:center;padding:80px 20px;grid-column:1/-1;}
  </style>
</head>
<body>
<nav class="nav">
  <a class="nav-back" href="index.html">← Home</a>
  <a class="nav-logo" href="index.html">HARMAAL<span>WALE</span></a>
  <div class="nav-right">
    <div class="theme-toggle" onclick="hwToggleTheme()">
      <div class="toggle-track"><div class="toggle-knob"></div></div>
      <span class="toggle-label">Light</span>
    </div>
    <a class="nav-icon nav-user-icon" href="#" data-action="login" title="Account">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
    <a class="nav-icon" href="cart.html" title="Cart" style="position:relative">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="nav-badge cart-badge" style="display:none">0</span>
    </a>
  </div>
</nav>

<div class="section">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div class="section-title">MY <span>WISHLIST</span> <span id="wishCount" style="font-size:18px;color:var(--text-3)"></span></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-secondary btn-sm" onclick="moveAllToCart()">Move All to Cart</button>
      <button class="btn btn-secondary btn-sm" style="color:var(--error);border-color:var(--error)" onclick="clearWishlist()">Clear All</button>
    </div>
  </div>
  <div class="wish-grid" id="wishGrid"></div>
</div>

<a class="wa-float" href="https://wa.me/917891004042" target="_blank">💬</a>
<script src="assets/js/hw.js"></script>
<script>
  function renderWishlist() {
    const list = HW.getWishlist();
    const grid = document.getElementById('wishGrid');
    document.getElementById('wishCount').textContent = list.length ? `(${list.length})` : '';

    if (!list.length) {
      grid.innerHTML = `<div class="empty-state">
        <div style="font-size:56px;margin-bottom:16px">❤️</div>
        <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:var(--text)">Wishlist is Empty</h2>
        <p style="font-size:14px;color:var(--text-3);margin-top:8px">Save products you like and come back to them anytime</p>
        <a href="mfd-spares.html" class="btn btn-primary" style="margin-top:20px">Browse Products →</a>
      </div>`;
      return;
    }

    grid.innerHTML = list.map(item => `
      <div class="wish-card">
        <div class="wish-img">
          ${item.image ? `<img src="${item.image}" alt="${item.name}">` : '🖨️'}
          <button class="wish-remove" onclick="removeWish('${item.id}')">✕</button>
        </div>
        <div class="wish-body">
          <div class="wish-cat">${item.category || 'MFD Part'}</div>
          <div class="wish-name">${item.name}</div>
          <div style="font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px">
            ${item.price ? '₹' + parseFloat(item.price).toLocaleString('en-IN') : 'Price on enquiry'}
          </div>
          <div class="wish-actions">
            <button class="btn btn-primary btn-sm" style="flex:1" onclick="moveToCart('${item.id}')">Add to Cart</button>
            <a class="btn btn-secondary btn-sm" href="https://wa.me/917891004042?text=Hi%2C%20I%27m%20interested%20in%20${encodeURIComponent(item.name)}" target="_blank">💬</a>
          </div>
        </div>
      </div>`).join('');
  }

  function removeWish(id) {
    HW.removeFromWishlist(id);
    renderWishlist();
  }

  function moveToCart(id) {
    const item = HW.getWishlist().find(i => i.id === id);
    if (!item) return;
    HW.addToCart(item);
    HW.removeFromWishlist(id);
    renderWishlist();
  }

  function moveAllToCart() {
    const list = HW.getWishlist();
    list.forEach(item => HW.addToCart(item));
    HW.saveWishlist([]);
    HW.updateWishlistBadge();
    renderWishlist();
    HW.showToast(`${list.length} items moved to cart`, 'success');
  }

  function clearWishlist() {
    if (!confirm('Remove all items from wishlist?')) return;
    HW.saveWishlist([]);
    HW.updateWishlistBadge();
    renderWishlist();
  }

  renderWishlist();
</script>
</body>
</html>
