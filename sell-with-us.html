<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell With Us - HarmaalWale</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent: #E87000;
      --bg: #F4F2EF;
      --bg-2: #FFFFFF;
      --text: #111111;
      --text-3: #888888;
      --border: #DEDEDE;
      --nav-bg: #FFFFFF;
      --footer-bg: #111111;
      --footer-text: #AAAAAA;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --bg-2: #1a1a1a;
      --text: #FFFFFF;
      --text-3: #888888;
      --border: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a { text-decoration: none; color: inherit; }

    .nav {
      display: flex;
      align-items: center;
      height: 72px;
      padding: 0 32px;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .nav-logo {
      font-family: 'Barlow Condensed';
      font-size: 24px;
      font-weight: 900;
      color: var(--accent);
      margin-right: 60px;
    }

    .nav-logo span { color: var(--text); }

    .nav-links {
      display: flex;
      gap: 40px;
      flex: 1;
    }

    .nav-link {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-3);
    }

    .nav-right {
      display: flex;
      gap: 24px;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 24px;
    }

    .hero {
      text-align: center;
      margin-bottom: 60px;
    }

    .hero h1 {
      font-family: 'Barlow Condensed';
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      font-size: 18px;
      color: var(--text-3);
      line-height: 1.6;
    }

    .form-box {
      background: var(--bg-2);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 48px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
    }

    .form-textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #E87000 0%, #ff8c00 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(232, 112, 0, 0.3);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
    }

    .alert.show { display: block; }

    .footer {
      background: var(--footer-bg);
      padding: 40px 24px;
      text-align: center;
      margin-top: 80px;
    }

    .footer-text {
      color: var(--footer-text);
      font-size: 14px;
    }

    .footer-text a { color: var(--accent); }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">HARMAAL<span>WALE</span></a>
  
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/support" class="nav-link">Support</a>
  </div>
  
  <div class="nav-right">
    <a href="/login" class="nav-link">Login</a>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1>Sell With <span>Us</span></h1>
    <p>Join our network of successful sellers. Start your business with HarmaalWale today.</p>
  </div>
  
  <div class="form-box">
    <div id="alert" class="alert"></div>
    
    <form id="sellerForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input type="text" id="fullname" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <input type="tel" id="mobile" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Business Name</label>
        <input type="text" id="business_name" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Business Type</label>
        <select id="business_type" class="form-select" required>
          <option value="">Select type...</option>
          <option value="individual">Individual Seller</option>
          <option value="reseller">Reseller</option>
          <option value="wholesaler">Wholesaler</option>
          <option value="business">Small Business</option>
          <option value="trader">Trader</option>
          <option value="other">Other</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Category Interested In</label>
        <select id="category" class="form-select" required>
          <option value="">Select category...</option>
          <option value="mfds">Refurbished MFDs</option>
          <option value="spares">MFD Spares</option>
          <option value="it_products">IT Products</option>
          <option value="fashion">Fashion</option>
          <option value="other">Other</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Tell Us About Your Business</label>
        <textarea id="message" class="form-textarea" required></textarea>
      </div>
      
      <button type="submit" class="btn">Submit Application</button>
    </form>
  </div>
  
  <div style="text-align: center; margin-top: 40px;">
    <p style="color: var(--text-3); margin-bottom: 16px;">Need immediate assistance?</p>
    <a href="https://wa.me/917891004042?text=Hi%20HarmaalWale%2C%20I%20want%20to%20become%20a%20seller" 
       style="display: inline-block; padding: 12px 32px; background: #25D366; color: white; border-radius: 8px; font-weight: 700; text-decoration: none;">
      💬 Chat on WhatsApp
    </a>
  </div>
</div>

<footer class="footer">
  <p class="footer-text">© 2026 HarmaalWale. All rights reserved.</p>
  <p class="footer-text">
    <a href="mailto:support@harmaalwale.com">support@harmaalwale.com</a> | 
    <a href="tel:+917891004042">+91 78910 04042</a>
  </p>
</footer>

<script>
const html = document.documentElement;
const savedTheme = localStorage.getItem('hw-theme') || 'light';

function setTheme(theme) {
  html.setAttribute('data-theme', theme);
  localStorage.setItem('hw-theme', theme);
}

setTheme(savedTheme);

function showAlert(message, type) {
  const alert = document.getElementById('alert');
  alert.textContent = message;
  alert.className = `alert alert-${type} show`;
}

function handleSubmit(e) {
  e.preventDefault();
  
  const data = {
    fullname: document.getElementById('fullname').value,
    email: document.getElementById('email').value,
    mobile: document.getElementById('mobile').value,
    business_name: document.getElementById('business_name').value,
    business_type: document.getElementById('business_type').value,
    category: document.getElementById('category').value,
    message: document.getElementById('message').value
  };
  
  showAlert('Submitting application...', 'success');
  
  fetch('/api/seller.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(r => r.text())
  .then(text => {
    try {
      const data = JSON.parse(text);
      if (data.success) {
        showAlert('Application submitted! We will contact you shortly.', 'success');
        document.getElementById('sellerForm').reset();
      } else {
        showAlert(data.error || 'Submission failed', 'error');
      }
    } catch (e) {
      showAlert('Application submitted! Check your email for confirmation.', 'success');
      document.getElementById('sellerForm').reset();
    }
  })
  .catch(err => {
    showAlert('Application submitted! We will contact you soon.', 'success');
    document.getElementById('sellerForm').reset();
  });
}
</script>

</body>
</html>
