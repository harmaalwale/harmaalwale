# nginx.conf — HarmaalWale v3
# Place this in /etc/nginx/sites-available/harmaalwale

server {
    listen 80;
    listen 443 ssl;
    server_name harmaalwale.com www.harmaalwale.com;

    # Hide nginx version (fixes #4 #8 #12 #16 #20 #32 #37 #41 #45 #50 #53 #57 #61 #65)
    server_tokens off;

    root /var/www/harmaalwale;
    index index.html;

    # Security headers (fixes #3 #7 #11 #15 #19 #31 #36 #40 #44 #49 #52 #56 #60 #64)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https: data:;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Performance: gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets (performance fix for #33)
    location ~* \.(jpg|jpeg|png|gif|svg|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
