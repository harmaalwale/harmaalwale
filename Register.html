<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - HarmaalWale</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent: #E87000;
      --bg: #F4F2EF;
      --bg-2: #FFFFFF;
      --text: #111111;
      --text-3: #888888;
      --border: #DEDEDE;
      --nav-bg: #FFFFFF;
      --footer-bg: #111111;
      --footer-text: #AAAAAA;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --bg-2: #1a1a1a;
      --text: #FFFFFF;
      --text-3: #888888;
      --border: #333333;
      --nav-bg: #1a1a1a;
      --footer-bg: #000000;
      --footer-text: #555555;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s;
    }

    a { text-decoration: none; color: inherit; }

    .nav {
      display: flex;
      align-items: center;
      height: 72px;
      padding: 0 32px;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .nav-logo {
      font-family: 'Barlow Condensed';
      font-size: 24px;
      font-weight: 900;
      color: var(--accent);
      margin-right: 60px;
    }

    .nav-logo span { color: var(--text); }

    .nav-links {
      display: flex;
      gap: 40px;
      flex: 1;
    }

    .nav-link {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-3);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      padding: 0 24px;
    }

    .form-box {
      background: var(--bg-2);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 48px;
    }

    h1 {
      font-family: 'Barlow Condensed';
      font-size: 42px;
      font-weight: 900;
      margin-bottom: 32px;
    }

    h1 span { color: var(--accent); }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #E87000 0%, #ff8c00 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .form-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-3);
    }

    .form-link a {
      color: var(--accent);
      font-weight: 600;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
    }

    .alert.show { display: block; }

    .footer {
      background: var(--footer-bg);
      padding: 40px 24px;
      text-align: center;
      margin-top: 80px;
    }

    .footer-text {
      color: var(--footer-text);
      font-size: 14px;
    }

    .footer-text a { color: var(--accent); }

    .divider {
      text-align: center;
      margin: 24px 0;
      color: var(--text-3);
    }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">HARMAAL<span>WALE</span></a>
  
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/support" class="nav-link">Support</a>
  </div>
  
  <div class="nav-right">
    <div class="theme-toggle" onclick="toggleTheme()">
      <span style="font-size: 18px;">🌙</span>
    </div>
  </div>
</nav>

<div class="container">
  <div class="form-box">
    <h1>Create <span>Account</span></h1>
    
    <div id="alert" class="alert"></div>
    
    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="fullname" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Mobile</label>
        <input type="tel" id="mobile" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirm_password" class="form-input" required>
      </div>
      
      <button type="submit" class="btn">Register Now</button>
    </form>
    
    <div class="divider">OR</div>
    
    <div class="form-link">
      Already have an account? <a href="/login">Login here</a>
    </div>
    
    <div style="margin-top: 24px;">
      <button type="button" class="btn" style="background: #25D366;" onclick="location.href='https://wa.me/917891004042?text=Hi%20HarmaalWale%2C%20I%20want%20to%20register'">
        💬 Register via WhatsApp
      </button>
    </div>
  </div>
</div>

<footer class="footer">
  <p class="footer-text">© 2026 HarmaalWale. All rights reserved.</p>
  <p class="footer-text">
    <a href="mailto:support@harmaalwale.com">support@harmaalwale.com</a> | 
    <a href="tel:+917891004042">+91 78910 04042</a>
  </p>
</footer>

<script>
const html = document.documentElement;
const savedTheme = localStorage.getItem('hw-theme') || 'light';

function setTheme(theme) {
  html.setAttribute('data-theme', theme);
  localStorage.setItem('hw-theme', theme);
}

function toggleTheme() {
  const currentTheme = html.getAttribute('data-theme');
  setTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

setTheme(savedTheme);

function showAlert(message, type) {
  const alert = document.getElementById('alert');
  alert.textContent = message;
  alert.className = `alert alert-${type} show`;
}

function handleRegister(e) {
  e.preventDefault();
  
  const fullname = document.getElementById('fullname').value;
  const email = document.getElementById('email').value;
  const mobile = document.getElementById('mobile').value;
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  
  if (password !== confirm) {
    showAlert('Passwords do not match', 'error');
    return;
  }
  
  showAlert('Creating account...', 'success');
  
  fetch('/api/register.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fullname, email, mobile, password })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      showAlert('Account created! Redirecting to login...', 'success');
      setTimeout(() => location.href = '/login', 1500);
    } else {
      showAlert(data.error || 'Registration failed', 'error');
    }
  })
  .catch(err => {
    showAlert('Unable to reach server. Try WhatsApp.', 'error');
  });
}
</script>

</body>
</html>
