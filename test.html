<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deployment Tracker – HarmaalWale</title>
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/hw.css">
  <style>
    .tracker-wrap {
      min-height: calc(100vh - 66px);
      padding: 40px 20px;
      background: var(--bg);
    }

    .tracker-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .tracker-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .tracker-title span {
      color: var(--accent);
    }

    .tracker-sub {
      color: var(--text-3);
      margin-bottom: 32px;
      font-size: 14px;
      font-weight: 500;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .status-card {
      background: var(--bg-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s ease;
      box-shadow: var(--card-shadow);
    }

    .status-card:hover {
      border-color: var(--accent);
      box-shadow: var(--card-shadow-h);
    }

    .status-card h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-3);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .status-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      font-family: 'Courier New', monospace;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .badge-success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .badge-failed {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .badge-pending {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .deploy-history {
      background: var(--bg-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--card-shadow);
    }

    .history-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .history-item {
      padding: 16px;
      border-left: 4px solid var(--accent);
      background: var(--bg-3);
      border-radius: 8px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .history-item:hover {
      transform: translateX(4px);
      border-left-color: var(--accent-h);
    }

    .history-file {
      font-weight: 700;
      color: var(--text);
      font-size: 15px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.5px;
    }

    .history-location {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 6px;
      font-family: 'Courier New', monospace;
      word-break: break-all;
    }

    .history-time {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 6px;
    }

    .history-status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-success {
      background: #f0fdf4;
      color: #15803d;
    }

    .last-sync {
      font-size: 13px;
      color: var(--text-3);
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .no-data {
      color: var(--text-3);
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    [data-theme="dark"] .badge-success {
      background: #0d2818;
      color: #4ade80;
      border-color: #166534;
    }

    [data-theme="dark"] .badge-failed {
      background: #2d0e0e;
      color: #f87171;
      border-color: #7f1d1d;
    }

    [data-theme="dark"] .badge-pending {
      background: #0e1a2d;
      color: #60a5fa;
      border-color: #1e3a5f;
    }

    [data-theme="dark"] .status-success {
      background: #0d2818;
      color: #4ade80;
    }

    @media (max-width: 640px) {
      .tracker-title {
        font-size: 28px;
      }

      .status-grid {
        grid-template-columns: 1fr;
      }

      .deploy-history {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">HARMAAL<span>WALE</span></a>
  <div class="nav-right">
    <div class="theme-toggle" onclick="toggleTheme()">
      <div class="toggle-track">
        <div class="toggle-knob"></div>
      </div>
      <span class="toggle-label" id="themeLabel">Light</span>
    </div>
  </div>
</nav>

<div class="tracker-wrap">
  <div class="tracker-container">
    <h1 class="tracker-title">Deployment <span>Tracker</span></h1>
    <p class="tracker-sub">Live deployment status and history</p>

    <div class="status-grid">
      <div class="status-card">
        <h3>📅 Last Deployment</h3>
        <div class="status-value" id="lastDeploy">
          <span class="loading"></span>
        </div>
      </div>

      <div class="status-card">
        <h3>🔗 GitHub Status</h3>
        <div class="status-value" id="githubStatus">--</div>
        <span class="status-badge badge-pending" id="githubBadge">
          <span class="loading"></span> Checking...
        </span>
      </div>

      <div class="status-card">
        <h3>☁️ cPanel Status</h3>
        <div class="status-value" id="cpanelStatus">--</div>
        <span class="status-badge badge-pending" id="cpanelBadge">
          <span class="loading"></span> Checking...
        </span>
      </div>
    </div>

    <div class="deploy-history">
      <h2 class="history-title">📁 Files Deployed</h2>
      <div id="filesContainer">
        <p class="no-data">
          <span class="loading"></span> Loading deployment history...
        </p>
      </div>

      <div class="last-sync">
        <p>📡 Page auto-refreshes every 5 seconds</p>
        <p id="lastSync" style="font-size: 12px; margin-top: 12px;">Last updated: --</p>
      </div>
    </div>
  </div>
</div>

<script>
  // Theme functionality
  const html = document.documentElement;
  const lbl = document.getElementById('themeLabel');
  const saved = localStorage.getItem('hw-theme') || 'light';

  function setTheme(t) {
    html.setAttribute('data-theme', t);
    lbl.textContent = t === 'dark' ? 'Dark' : 'Light';
    localStorage.setItem('hw-theme', t);
  }

  function toggleTheme() {
    const current = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    setTheme(current);
  }

  setTheme(saved);

  // Load and display deployment log
  async function loadDeploymentLog() {
    try {
      const response = await fetch('deploy-log.json?t=' + Date.now());

      if (!response.ok) {
        throw new Error('Log file not found');
      }

      const data = await response.json();

      // Update last deployment
      document.getElementById('lastDeploy').textContent = data.lastDeployment || '--';

      // Update GitHub status
      document.getElementById('githubStatus').textContent = data.githubTime || '--';
